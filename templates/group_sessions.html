<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Часови група</title>
    <link rel="stylesheet" href="{{ app_url_for('static', filename='css/base.css') }}">
</head>
<body>
  {% set page_title = 'Часови група' %}
  {% set active_page = 'group-sessions' %}
  {% include '_site_header.html' %}

  <main class="page-shell group-sessions-shell">
    <section class="teacher-sessions-toolbar attendance-panel">
      <label for="academic-year-select">Школска година:</label>
      <select id="academic-year-select">
        {% for item in academic_years %}
          <option value="{{ item.academic_year }}"{% if item.academic_year == selected_academic_year %} selected{% endif %}>
            {{ item.academic_year }}
          </option>
        {% endfor %}
      </select>

      <label for="season-select">Семестар:</label>
      <select id="season-select">
        {% for item in seasons %}
          <option value="{{ item.value }}"{% if item.value == selected_season %} selected{% endif %}>
            {{ item.label }}
          </option>
        {% endfor %}
      </select>

      <label for="group-select">Група:</label>
      <select id="group-select"></select>
      <p class="teacher-sessions-note">Изаберите школску годину, семестар и групу.</p>
    </section>

    <section id="group-sessions-root" aria-live="polite"></section>
  </main>

  <script>
    window.APP_CONFIG = {
        BASE_PATH: "{{ config['APPLICATION_ROOT'] }}".replace(/\/$/, "")
    };
  </script>
  <script type="module" src="{{ app_url_for('static', filename='js/siteHeader.js') }}"></script>
  <script type="module" src="{{ app_url_for('static', filename='js/groupSessions.js') }}"></script>
</body>
</html>
