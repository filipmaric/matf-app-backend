<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Моје резервације</title>
    <link rel="stylesheet" href="{{ app_url_for('static', filename='css/base.css') }}">
</head>
<body>
  {% set page_title = 'Моје резервације' %}
  {% set active_page = 'reservations' %}
  {% include '_site_header.html' %}

  <main class="page-shell reservations-page-shell">
    <p id="page-message"></p>

    <div id="reservations-page" style="display:none">
      <div class="semester-toolbar">
        <label for="semester-select">Семестар:</label>
        <select id="semester-select"></select>
      </div>

      <section>
        <h2>Личне резервације</h2>
        <div id="personal-reservations"></div>
      </section>

      <section>
        <h2>Предмети и недељни термини</h2>
        <div id="course-reservations"></div>
      </section>
    </div>
  </main>

  <script type="module" src="{{ app_url_for('static', filename='js/siteHeader.js') }}"></script>

  <script>
    window.APP_CONFIG = {
        BASE_PATH: "{{ config['APPLICATION_ROOT'] }}".replace(/\/$/, "")
    };
  </script>
  <script type="module" src="{{ app_url_for('static', filename='js/myReservations.js') }}"></script>
</body>
</html>
