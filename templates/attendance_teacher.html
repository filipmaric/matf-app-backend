<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Присуство на часу</title>
    <link rel="stylesheet" href="{{ app_url_for('static', filename='css/base.css') }}">
</head>
<body>
  {% set page_title = 'Присуство на часу' %}
  {% set active_page = 'attendance' %}
  {% include '_site_header.html' %}

  <main class="page-shell teacher-page-shell attendance-teacher-shell">
    <div id="attendance-root"
         data-kind="{{ attendance_kind }}"
         data-event-id="{{ attendance_event_id }}"
         data-event-date="{{ attendance_event_date }}">
    </div>
  </main>

  <script>
    window.APP_CONFIG = {
        BASE_PATH: "{{ config['APPLICATION_ROOT'] }}".replace(/\/$/, "")
    };
  </script>
  <script type="module" src="{{ app_url_for('static', filename='js/siteHeaderBootstrap.js') }}"></script>
  <script type="module" src="{{ app_url_for('static', filename='js/attendanceTeacher.js') }}"></script>
</body>
</html>
