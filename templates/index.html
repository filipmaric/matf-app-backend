<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Резервације учионица</title>
    <link rel="stylesheet" href="{{ app_url_for('static', filename='css/base.css') }}">
</head>
<body>
  <main class="page-shell main-page-shell">
    {% set page_title = 'Резервације учионица' %}
    {% set active_page = 'home' %}
    {% include '_site_header.html' %}
    <div class="date-toolbar">
      <label for="date-input">Датум</label>
      <div class="date-control-inputs">
        <button id="date-prev" type="button" aria-label="Претходни дан">&lt;&lt;</button>
        <input type="date" id="date-input" value="">
        <button id="date-next" type="button" aria-label="Следећи дан">&gt;&gt;</button>
      </div>
    </div>

    <div id="occupancy"></div>
  </main>

  <script>
    window.APP_CONFIG = {
        BASE_PATH: "{{ config['APPLICATION_ROOT'] }}".replace(/\/$/, "")
    };
  </script>
  <script type="module" src="{{ app_url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
